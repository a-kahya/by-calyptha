<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — By Calyptha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .faq-item{
    background:#fff;
    border-radius:var(--radius-md);
    box-shadow:var(--shadow);
    margin-bottom:12px;
    overflow:hidden;
  }
  .faq-question{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:16px 18px;
    font-family:var(--font-body);
    font-weight:800;
    font-size:.95rem;
    color:var(--plum);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  /*avec les 2 règles qui suivent : l'icone + dans la question est 
  transformée en un x pour fermer quand la question est ouverte */
  .faq-question .icon { 
    transition:transform .2s ease; flex-shrink:0; 
  }
  .faq-item.open .faq-question .icon { 
    transform:rotate(45deg); 
  }

  .faq-answer{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
    padding:0 18px;
    color:var(--plum-soft);
    font-size:.9rem;
    line-height:1.6;
  }
  .faq-item.open .faq-answer{
    max-height:600px;
    padding-bottom:16px;
  }
  .faq-images{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
  }
  .faq-images img{
    width:160px;
    border-radius:12px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }

  /* Lightbox : on a display none, et position fixed avec les 4 côtés à 0 font que
  cet élément recouvre toute la page
  display:none le cache par défaut mais la classe active (dans la 2eme règle fait basculer 
  display à flex pour afficher son contenu*/
  #lightbox{
    display:none;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(60,34,51,0.88);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  #lightbox.active{ 
    display:flex; 
  }

  #lightbox .lightbox-inner{
    position:relative;
    max-width:92vw;
    max-height:92vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  #lightbox img{
    max-width:92vw;
    max-height:78vh;
    object-fit:contain;
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    display:block;
  }
  #lightboxClose{
    position:absolute;
    top:-16px;right:-16px;
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:#fff;
    color:#3c2233;
    font-size:1.1rem;
    font-weight:800;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.3);
  }
  #lightboxBack{
    color:#fff;
    font-weight:800;
    font-size:.9rem;
    cursor:pointer;
    background:none;
    border:none;
    text-decoration:underline;
  }
</style>
</head>
<body>

<header class="site-header" style="padding-bottom:22px;">
  <div class="header-row">
    <a class="logo" href="index.html"><span class="logo-badge">🎀</span> By Calyptha</a>
    <nav class="header-nav">
      <a href="index.html">Boutique</a>
      <a href="apropos.html">À propos</a>
      <a href="galerie.html">Galerie</a>
      <a href="faq.html">FAQ</a>
      <a href="panier.html" class="cart-pill">🛍️ Panier <span data-cart-count style="display:none;">0</span></a>
    </nav>
  </div>
</header>

<main style="max-width:720px;">
  <h2 class="section-title">💬 Questions fréquentes</h2>

  <div id="faqList"></div>
</main>

<footer>By Calyptha — fait main, avec 💕 · Expédition via Mondial Relay</footer>

<!-- Lightbox : affiche l'image en grand au clic -->
<div id="lightbox">
  <div class="lightbox-inner">
    <button id="lightboxClose" aria-label="Fermer">✕</button>
    <img id="lightboxImg" src="" alt="Image en grand">
    <button id="lightboxBack">← Retour</button>
  </div>
</div>

<script src="panier.js"></script>
<script>
  //un tableau d'objet avec à chaque fois une question et une réponse
  //précision pour la dernière question (voir là-bas)
  const FAQ = [
    {
      q: "Combien de temps faut-il pour recevoir ma commande ?",
      r: "J'essaie d'expédier les colis une fois par semaine, puis le temps d'acheminement Mondial Relay classique. Cela dépend donc de ton lieu de résidence (France, Belgique...)"
    },
    {
      q: "Comment se passe la livraison ?",
      r: "Toutes les commandes sont expédiées via Mondial Relay. Une fois ta commande validée et le paiement reçu, tu recevras un email pour choisir ton point relais (vérifie tes spams!), puis un autre dès que le colis y est déposé. Une fois le colis disponible au point relais que tu as choisi, ou pour la livraison à ton adresse, Mondial Relay envoie également un mail."
    },
    {
      q: "Comment entretenir mes articles au crochet ?",
      r: "En général, un lavage à la main à l'eau froide est recommandé pour préserver la forme et les couleurs. Évite le sèche-linge."
    },
    {
      q: "Est-ce que je peux demander une couleur ou un modèle personnalisé ?",
      r: "N'hésite pas à me contacter avant de commander pour en discuter — selon les modèles et le temps disponible, c'est parfois possible ! Tu peux essayer de me contacter sur TikTok directement : @calyptha"
    },
    {
      q: "Que se passe-t-il si l'article que je veux est marqué comme vendu ?",
      r: "Un article vendu peut parfois être refait plus tard, surtout s'il s'agit d'un modèle populaire. Tu peux me le demander directement ou bien revenir de temps en temps faire un tour dans la boutique, ou garde un œil sur la galerie pour voir mes dernières créations."
    },
    {
      q: "Comment se passe le paiement ?",
      r: "Le paiement se fait via PayPal, avec le montant exact (articles + frais de port) calculé automatiquement dans le panier."
    },
    {
      //ici la dernière question injecte du html avec div etc. c'est ok car on a innerHTML pour l'injecter
      // vs textContent (qui l'afficherait tel quel avec les balises visibles)
      q: "Quels sont les avis en général ?",
      r: `Positifs à 99,99% ! Voici quelques retours de quand je vendais sur Vinted :
      <div class="faq-images">
        <img src="images/avis-vinted-1.jpg" alt="Avis client Vinted">
        <img src="images/avis-vinted-2.jpg" alt="Avis client Vinted">
        <img src="images/avis-vinted-3.jpg" alt="Avis client Vinted">
        <img src="images/avis-vinted-4.jpg" alt="Avis client Vinted">
      </div>`
    }
  ];

  const faqList = document.getElementById("faqList");

  //le forEach reçoit 2 param : l'item aka l'élément courant et i son indice 
  // i n'est jamais utilisé ici par contre
  FAQ.forEach((item, i) => {
    const div = document.createElement("div");
    //différence entre className et div.classList.add("faq-item") 
    // className remplace toute la liste de classes d'un coup (overwrite par dessus) 
    // classList.add() en ajoute une sans toucher aux autres 
    // ici il n'y a qu'une seule classe à mettre, donc className suffit
    div.className = "faq-item";
    div.innerHTML = `
      <button class="faq-question">
        ${item.q}
        <span class="icon">+</span>
      </button>
      <div class="faq-answer">${item.r}</div>
    `;
    //on écoute le clic, et on bascule (toggle) la classe open sur la carte entière (div, pas juste le bouton)
    //c'est ce qui active la règle CSS .faq-item.open .faq-answer (plus haut) --> provoque l'ouverture ou la fermeture
    div.querySelector(".faq-question").addEventListener("click", () => {
      div.classList.toggle("open");
    });
    faqList.appendChild(div);
  });

  // Lightbox : ouvre en grand n'importe quelle image dans une réponse de FAQ
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");

  function ouvrirLightbox(src) {
    //on a qu'une seule balise oimg dans la lightbox <img id="lightboxImg" src="">
    // mais on sait pas à l'avance quelle image afficher en grand, donc src est vide
    //ici on change la source de l'image par la src en paramètre, c'est-à-dire
    // le param src reçoit au moment de l'appel l'adresse de l'image sur laquelle on a cliqué
    lightboxImg.src = src;
    lightbox.classList.add("active");
  }
  function fermerLightbox() {
    lightbox.classList.remove("active");
  }

  document.querySelectorAll(".faq-images img").forEach(img => {
    img.addEventListener("click", (e) => {
      //stopPropagation = un clic sur une image ne déclenche pas qu'un seul événement isolé
      // il remonte ensuite vers les éléments parents (l'image est dans .faq-answer, qui est dans .faq-item, qui contient le <button class="faq-question">...)
      // Sans stopPropagation(), le clic sur l'image pourrait aussi être interprété comme un clic quelque part dans la carte
      // --> risque de perturber d'autres écouteurs posés plus haut dans la hiérarchie
      // Ici, ça empêche le clic sur l'image de "fuiter" vers autre chose(réflexe similaire à e.preventDefault)
      // mais donc résout un problème différent car preventDefault() annule le comportement par défaut d'un élément (comme suivre un lien) 
      // stopPropagation() empêche l'événement de se propager aux éléments parents
      e.stopPropagation();
      ouvrirLightbox(img.src);
    });
  });

  document.getElementById("lightboxClose").addEventListener("click", fermerLightbox);
  document.getElementById("lightboxBack").addEventListener("click", fermerLightbox);
  //ici c'est pour ajouter une 3ème manière de fermer la photo
  //on met l'écouteur sur toute la lightbox, donc le fond sombre qui recouvre tout l'écran (à l'intérieur duquel on a le lightbox-inner qui lui contient l'img etc)
  //si on clique sur un endroit sombre, on veut fermer l'img
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) fermerLightbox();
  });
  //et 4ème manière de fermer, appuyer sur le key escape du clavier donc on écoute keydown cette fois
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") fermerLightbox();
  });
</script>
</body>
</html>
