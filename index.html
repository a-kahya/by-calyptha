<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>By Calyptha — Créations au crochet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <a class="logo" href="index.html">
      <span class="logo-badge">🎀</span> By Calyptha
    </a>
    <nav class="header-nav">
      <a href="index.html">Boutique</a>
      <a href="apropos.html">Mon univers 💕 </a>
      <a href="panier.html" class="cart-pill">
        🛍️ Panier <span data-cart-count style="display:none;">0</span>
      </a>
    </nav>
  </div>
  <div class="hero-strip">
    <p class="visit-counter">✨ <span id="visitCount">···</span> visites sur la boutique</p>
    <h1>Fait main, fait avec amour 🧸</h1>
  </div>
</header>

<main>
  <h2 class="section-title">✨ Toute la boutique</h2>
  <div id="grid" class="grid"></div>
</main>

<footer>By Calyptha — fait main, avec 💕 · Expédition via Mondial Relay</footer>

<script src="produits.js"></script>
<script src="panier.js"></script>
<script>
  const grid = document.getElementById("grid");

  // Articles disponibles d'abord, puis vendus (à la fin, grisés)
  const tries = [...PRODUITS].sort((a, b) => (a.vendu === b.vendu) ? 0 : a.vendu ? 1 : -1);

  if (tries.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🧵</div>La boutique est vide pour le moment, reviens bientôt !</div>`;
  }

  tries.forEach(p => {
    const card = document.createElement("a");
    card.href = `produit.html?id=${encodeURIComponent(p.id)}`;
    card.className = "card";
    card.innerHTML = `
      <div class="thumb">
        ${p.vendu ? `<span class="badge-sold">Vendu</span>` : ""}
        <img src="${p.photos[0]}" alt="${p.nom}" loading="lazy">
      </div>
      <div class="body">
        <h3>${p.nom}</h3>
        <div class="price">${formaterPrix(p.prix)}</div>
      </div>
    `;
    if (p.vendu) card.style.opacity = "0.55";
    grid.appendChild(card);
  });
</script>
<script>
  // Récupère et affiche le nombre total de visites (GoatCounter)
  fetch("https://by-calyptha.goatcounter.com/counter/TOTAL.json")
    .then(r => r.json())
    .then(data => {
      document.getElementById("visitCount").textContent = data.count;
    })
    .catch(() => {
      const el = document.querySelector(".visit-counter");
      if (el) el.style.display = "none";
    });
</script>

<!-- GoatCounter : comptage des visites, respectueux de la vie privée -->
<script data-goatcounter="https://by-calyptha.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</html>
