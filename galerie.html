<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie — By Calyptha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header" style="padding-bottom:22px;">
  <div class="header-row">
    <a class="logo" href="index.html"><span class="logo-badge">🎀</span> By Calyptha</a>
    <nav class="header-nav">
      <a href="index.html">Boutique</a>
      <a href="apropos.html">À propos</a>
      <a href="galerie.html">Galerie</a>
      <a href="panier.html" class="cart-pill">🛍️ Panier <span data-cart-count style="display:none;">0</span></a>
    </nav>
  </div>
</header>

<main>
  <h2 class="section-title">🖼️ Galerie de mes créations</h2>
  <p class="gallery-intro">
    Une petite vitrine de tout ce que j'ai pu créer au crochet au fil du temps —
    pas forcément à vendre, juste pour montrer mon travail et mon évolution 🎀
  </p>

  <div id="galerieGrid" class="gallery-grid"></div>
</main>

<footer>By Calyptha — fait main, avec 💕 · Expédition via Mondial Relay</footer>

<!-- Lightbox : affiche l'image en grand au clic -->
<div id="lightbox" class="lightbox-overlay">
  <img id="lightboxImg" src="" alt="Création en grand">
</div>

<script src="galerie.js"></script>
<script src="panier.js"></script>
<script>
  const galerieGrid = document.getElementById("galerieGrid");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");

  if (GALERIE.length === 0) {
    galerieGrid.innerHTML = `<div class="empty-state"><div class="icon">🧵</div>La galerie est vide pour le moment.</div>`;
  }

  GALERIE.forEach(item => {
    const card = document.createElement("div");
    card.className = "gallery-card";
    card.innerHTML = `<img src="${item.photo}" alt="Création By Calyptha" loading="lazy">`;
    card.addEventListener("click", () => {
      lightboxImg.src = item.photo;
      lightbox.classList.add("active");
    });
    galerieGrid.appendChild(card);
  });

  // Ferme le lightbox au clic n'importe où sur l'overlay
  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
  });
</script>
</body>
</html>
